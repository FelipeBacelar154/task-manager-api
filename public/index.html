<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="auth-section">
    <div class="auth-container">
      <div class="auth-logo">Task<span>Manager</span></div>
      <div class="tabs">
        <button class="tab active" onclick="showTab('login', this)">Login</button>
        <button class="tab" onclick="showTab('register', this)">Register</button>
      </div>
      <div id="login-form">
        <input type="email" id="login-email" placeholder="Email" />
        <input type="password" id="login-password" placeholder="Password" />
        <button onclick="login()">Login</button>
        <p id="login-error" class="error"></p>
      </div>
      <div id="register-form" style="display:none">
        <input type="text" id="register-name" placeholder="Name" />
        <input type="email" id="register-email" placeholder="Email" />
        <input type="password" id="register-password" placeholder="Password" />
        <button onclick="register()">Create account</button>
        <p id="register-error" class="error"></p>
      </div>
    </div>
  </div>

  <div id="tasks-section" style="display:none">
    <div class="sidebar">
      <div class="sidebar-logo">Task<span>Manager</span></div>
      <div class="nav-item active" onclick="filterTasks('all', this)">
        <span class="nav-dot"></span> All tasks
      </div>
      <div class="nav-item" onclick="filterTasks('pending', this)">
        <span class="nav-dot"></span> Pending
      </div>
      <div class="nav-item" onclick="filterTasks('done', this)">
        <span class="nav-dot"></span> Done
      </div>
      <div class="nav-item" onclick="filterTasks('overdue', this)">
        <span class="nav-dot overdue-dot"></span> Overdue
      </div>
      <div class="nav-item logout" onclick="logout()">
        <span class="nav-dot"></span> Logout
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <span class="topbar-title">My Tasks</span>
        <div class="topbar-right">
          <span class="topbar-name" id="user-name"></span>
          <div class="avatar" id="user-avatar"></div>
        </div>
      </div>

      <div class="content">
        <div class="stats">
          <div class="stat-card">
            <div class="stat-label">Total</div>
            <div class="stat-val purple" id="stat-total">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Pending</div>
            <div class="stat-val yellow" id="stat-pending">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Done</div>
            <div class="stat-val green" id="stat-done">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Overdue</div>
            <div class="stat-val red" id="stat-overdue">0</div>
          </div>
        </div>

        <!-- ADD TASK FORM -->
        <div class="add-bar">
          <div class="add-bar-row">
            <input type="text" id="task-title" placeholder="Task title..." />
            <input type="date" id="task-due-date" />
            <button onclick="createTask()">+ Add</button>
          </div>
          <div class="add-bar-row">
            <input type="text" id="task-description" placeholder="Description (optional)" />
            <div class="code-task-toggle">
              <label class="toggle-label">
                <input type="checkbox" id="is-code-task" onchange="toggleCodeTask()" />
                <span>Code task</span>
              </label>
            </div>
          </div>
          <div id="code-task-fields" style="display:none">
            <input type="text" id="task-file-path" placeholder="File path (e.g: C:\projects\app\src\routes\authRoutes.js)" />
          </div>
        </div>

        <div id="tasks-list"></div>
      </div>
    </div>
  </div>

  <!-- TASK DETAIL MODAL -->
  <div id="modal-overlay" style="display:none" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <p id="modal-description"></p>
        <div id="modal-due"></div>
        <div id="modal-code-btn"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
